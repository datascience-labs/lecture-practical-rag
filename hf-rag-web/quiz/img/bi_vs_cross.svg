<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" font-family="'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif"><title>Bi-encoder는 질문과 문서를 따로, Cross-encoder는 함께 읽는다</title><defs><marker id="a1f2d29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2d29"/></marker><marker id="a2f7d62" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d62"/></marker><marker id="a3b6fb6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fb6"/></marker><marker id="ad9822b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker><marker id="a7a5bb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5bb5"/></marker><marker id="a6b7a75" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7a75"/></marker><marker id="ac0504d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0504d"/></marker></defs><rect width="880" height="340" rx="16" fill="#ffffff"/><rect x="20" y="20" width="410" height="300" rx="16" fill="#e4edf8" stroke="#c9d4cf" stroke-width="1.5"/><text x="38" y="46" font-size="14" font-weight="700" fill="#6b7a75" text-anchor="start">Bi-encoder (임베딩) — 따로 읽기</text><rect x="450" y="20" width="410" height="300" rx="16" fill="#fbeedd" stroke="#c9d4cf" stroke-width="1.5"/><text x="468" y="46" font-size="14" font-weight="700" fill="#6b7a75" text-anchor="start">Cross-encoder (리랭커) — 함께 읽기</text><path d="M52,60 h126 q12,0 12,12 v16 q0,12 -12,12 h-98 l-14,14 l2,-14 h-12 q-12,0 -12,-12 v-16 q0,-12 12,-12 z" fill="#e4edf8" stroke="#3b6fb6" stroke-width="1.5"/><text x="115.0" y="85.0" font-size="13" font-weight="600" fill="#1f2d29" text-anchor="middle">질문</text><path d="M80,180 h24 l10,10 v34 h-34 z" fill="#fff" stroke="#2f7d62" stroke-width="2"/><path d="M104,180 v10 h10" fill="none" stroke="#2f7d62" stroke-width="2"/><line x1="86" y1="198" x2="107" y2="198" stroke="#2f7d62" stroke-width="2" opacity=".55"/><line x1="86" y1="206" x2="107" y2="206" stroke="#2f7d62" stroke-width="2" opacity=".55"/><line x1="86" y1="214" x2="107" y2="214" stroke="#2f7d62" stroke-width="2" opacity=".55"/><text x="97" y="245" font-size="13" font-weight="600" fill="#1f2d29" text-anchor="middle">문서</text><line x1="195" y1="80" x2="240" y2="80" stroke="#1f2d29" stroke-width="2" marker-end="url(#a1f2d29)"/><line x1="120" y1="200" x2="240" y2="200" stroke="#1f2d29" stroke-width="2" marker-end="url(#a1f2d29)"/><rect x="245" y="60" width="70" height="40" rx="8" fill="#fff" stroke="#3b6fb6" stroke-width="1.5"/><text x="280" y="85" font-size="12" font-weight="700" fill="#3b6fb6" text-anchor="middle">인코더</text><rect x="245" y="180" width="70" height="40" rx="8" fill="#fff" stroke="#3b6fb6" stroke-width="1.5"/><text x="280" y="205" font-size="12" font-weight="700" fill="#3b6fb6" text-anchor="middle">인코더</text><line x1="320" y1="80" x2="350" y2="120" stroke="#1f2d29" stroke-width="2" marker-end="url(#a1f2d29)"/><line x1="320" y1="200" x2="350" y2="160" stroke="#1f2d29" stroke-width="2" marker-end="url(#a1f2d29)"/><rect x="350" y="120" width="60" height="40" rx="8" fill="#fff" stroke="#1f2d29" stroke-width="1.5"/><text x="380" y="145" font-size="12" font-weight="700" fill="#1f2d29" text-anchor="middle">거리</text><text x="225" y="280" font-size="13" font-weight="700" fill="#3b6fb6" text-anchor="middle">문서 벡터는 미리 계산 → 빠르다</text><text x="225" y="302" font-size="12" font-weight="600" fill="#6b7a75" text-anchor="middle">단어끼리의 맞물림(부정 · 조건)은 못 본다</text><rect x="470" y="110" width="200" height="70" rx="10" fill="#fff" stroke="#d9822b" stroke-width="1.5"/><text x="570" y="138" font-size="14" font-weight="700" fill="#1f2d29" text-anchor="middle">[질문 + 문서]</text><text x="570" y="160" font-size="12" font-weight="400" fill="#6b7a75" text-anchor="middle">한 쌍으로 함께 입력</text><line x1="675" y1="145" x2="710" y2="145" stroke="#1f2d29" stroke-width="2" marker-end="url(#a1f2d29)"/><rect x="715" y="115" width="80" height="60" rx="10" fill="#fff" stroke="#d9822b" stroke-width="1.5"/><text x="755" y="150" font-size="13" font-weight="700" fill="#d9822b" text-anchor="middle">모델</text><line x1="800" y1="145" x2="830" y2="145" stroke="#1f2d29" stroke-width="2" marker-end="url(#a1f2d29)"/><text x="845" y="140" font-size="11" font-weight="700" fill="#d9822b" text-anchor="middle">관련도</text><text x="845" y="156" font-size="11" font-weight="700" fill="#d9822b" text-anchor="middle">점수</text><text x="655" y="280" font-size="13" font-weight="700" fill="#d9822b" text-anchor="middle">쌍마다 새로 계산 → 느리지만 정확</text><text x="655" y="302" font-size="12" font-weight="600" fill="#6b7a75" text-anchor="middle">그래서 후보 몇 개에만 쓴다</text></svg>