<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" font-family="'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif"><title>넓게 찾고(Hybrid) 정확하게 줄 세우는(Reranker) 2단계 검색</title><defs><marker id="a1f2d29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2d29"/></marker><marker id="a2f7d62" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d62"/></marker><marker id="a3b6fb6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fb6"/></marker><marker id="ad9822b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker><marker id="a7a5bb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5bb5"/></marker><marker id="a6b7a75" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7a75"/></marker><marker id="ac0504d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0504d"/></marker></defs><rect width="880" height="380" rx="16" fill="#ffffff"/><path d="M120,60 L760,60 L600,170 L280,170 Z" fill="none" stroke="#3b6fb6" stroke-width="2"/><path d="M120,60 L760,60 L600,170 L280,170 Z" fill="#e4edf8" opacity=".7"/><text x="440" y="100" font-size="15" font-weight="700" fill="#3b6fb6" text-anchor="middle">청크 전체</text><text x="440" y="126" font-size="13" font-weight="600" fill="#1f2d29" text-anchor="middle">1단계 Hybrid 검색 — 넓게 (Recall)</text><path d="M280,190 L600,190 L520,280 L360,280 Z" fill="#fbeedd" stroke="#d9822b" stroke-width="2"/><text x="440" y="228" font-size="15" font-weight="700" fill="#d9822b" text-anchor="middle">후보 10개</text><text x="440" y="252" font-size="13" font-weight="600" fill="#1f2d29" text-anchor="middle">2단계 리랭커가 다시 채점</text><rect x="330" y="300" width="38" height="30" rx="6" fill="#e3f1ea" stroke="#2f7d62" stroke-width="1.5"/><text x="349" y="320" font-size="13" font-weight="700" fill="#2f7d62" text-anchor="middle">1</text><rect x="376" y="300" width="38" height="30" rx="6" fill="#e3f1ea" stroke="#2f7d62" stroke-width="1.5"/><text x="395" y="320" font-size="13" font-weight="700" fill="#2f7d62" text-anchor="middle">2</text><rect x="422" y="300" width="38" height="30" rx="6" fill="#e3f1ea" stroke="#2f7d62" stroke-width="1.5"/><text x="441" y="320" font-size="13" font-weight="700" fill="#2f7d62" text-anchor="middle">3</text><rect x="468" y="300" width="38" height="30" rx="6" fill="#e3f1ea" stroke="#2f7d62" stroke-width="1.5"/><text x="487" y="320" font-size="13" font-weight="700" fill="#2f7d62" text-anchor="middle">4</text><rect x="514" y="300" width="38" height="30" rx="6" fill="#e3f1ea" stroke="#2f7d62" stroke-width="1.5"/><text x="533" y="320" font-size="13" font-weight="700" fill="#2f7d62" text-anchor="middle">5</text><text x="440" y="356" font-size="14" font-weight="700" fill="#2f7d62" text-anchor="middle">최종 Top-5 — 정확하게 줄 세우기 (MRR)</text><text x="800" y="230" font-size="12" font-weight="700" fill="#c0504d" text-anchor="middle">후보 10개 밖의 정답은</text><text x="800" y="250" font-size="12" font-weight="700" fill="#c0504d" text-anchor="middle">리랭커가 살릴 수 없다</text></svg>