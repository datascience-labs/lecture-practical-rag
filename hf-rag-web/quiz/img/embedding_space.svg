<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" font-family="'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif"><title>임베딩: 뜻이 비슷한 문장은 의미 공간에서 가까이 놓인다</title><defs><marker id="a1f2d29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2d29"/></marker><marker id="a2f7d62" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d62"/></marker><marker id="a3b6fb6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fb6"/></marker><marker id="ad9822b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker><marker id="a7a5bb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5bb5"/></marker><marker id="a6b7a75" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7a75"/></marker><marker id="ac0504d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0504d"/></marker></defs><rect width="880" height="360" rx="16" fill="#ffffff"/><rect x="40" y="30" width="520" height="300" rx="14" fill="#fafcfb" stroke="#c9d4cf" stroke-width="1.5"/><text x="300" y="58" font-size="13" font-weight="600" fill="#6b7a75" text-anchor="middle">의미 공간 (실제는 1,024차원 → 2차원으로 그린 것)</text><circle cx="80" cy="300" r="4" fill="#999"/><text x="84" y="320" font-size="11" font-weight="400" fill="#6b7a75" text-anchor="start">원점</text><path d="M80,300 L400,150" fill="none" stroke="#3b6fb6" stroke-width="1.2"/><circle cx="400" cy="150" r="8" fill="#3b6fb6"/><text x="414" y="154" font-size="13" font-weight="600" fill="#1f2d29" text-anchor="start">집 살 때 빌리는 돈</text><circle cx="430" cy="190" r="8" fill="#3b6fb6"/><text x="444" y="195" font-size="13" font-weight="600" fill="#1f2d29" text-anchor="start">주택구입자금 대출</text><circle cx="390" cy="225" r="8" fill="#3b6fb6"/><text x="404" y="230" font-size="13" font-weight="600" fill="#1f2d29" text-anchor="start">내 집 마련 대출</text><path d="M80,300 L150,110" fill="none" stroke="#d9822b" stroke-width="1.2"/><circle cx="150" cy="110" r="8" fill="#d9822b"/><text x="164" y="115" font-size="13" font-weight="600" fill="#1f2d29" text-anchor="start">주택연금 가입 나이</text><circle cx="200" cy="140" r="8" fill="#d9822b"/><text x="214" y="145" font-size="13" font-weight="600" fill="#1f2d29" text-anchor="start">몇 살부터 연금?</text><path d="M118,234 A76,76 0 0,1 146,258" fill="none" stroke="#6b7a75" stroke-width="2"/><text x="150" y="236" font-size="12" font-weight="600" fill="#6b7a75" text-anchor="start">각도</text><rect x="580" y="60" width="280" height="230" rx="14" fill="#fff" stroke="#c9d4cf" stroke-width="1.5"/><text x="720" y="92" font-size="15" font-weight="700" fill="#1f2d29" text-anchor="middle">코사인 유사도</text><text x="720" y="120" font-size="12" font-weight="400" fill="#6b7a75" text-anchor="middle">두 화살표의 방향이 같을수록 1에 가깝다</text><circle cx="610" cy="150" r="7" fill="#3b6fb6"/><text x="626" y="155" font-size="13" font-weight="600" fill="#1f2d29" text-anchor="start">파란 점끼리: 가깝다 → 유사도 높음</text><circle cx="610" cy="185" r="7" fill="#d9822b"/><text x="626" y="190" font-size="13" font-weight="600" fill="#1f2d29" text-anchor="start">주황 점끼리: 가깝다</text><text x="610" y="225" font-size="13" font-weight="600" fill="#1f2d29" text-anchor="start">파랑 ↔ 주황: 멀다 → 유사도 낮음</text><text x="610" y="260" font-size="12" font-weight="700" fill="#2f7d62" text-anchor="start">단어가 달라도 뜻이 같으면 가까이 놓인다</text><text x="862" y="346" font-size="11" font-weight="400" fill="#6b7a75" text-anchor="end">(점의 위치는 설명용 예시)</text></svg>